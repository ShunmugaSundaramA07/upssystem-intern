<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>UPS Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <link rel="icon" href="Logo Icon.png" />
  <style>
    :root {
      --primary-color: #2563eb;
      --primary-hover: #1d4ed8;
      --success-color: #22c55e;
      --warning-color: #f59e0b;
      --danger-color: #ef4444;
      --gray-color: #6b7280;
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-primary: #1e293b;
      --text-secondary: #64748b;
      --border-color: #e2e8f0;
      --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
      --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
      --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1);
    }

    * {
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: var(--bg-color);
      color: var(--text-primary);
    }

    .layout {
      display: flex;
      min-height: 100vh;
    }

    aside {
      width: 280px;
      background: var(--card-bg);
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--border-color);
      position: fixed;
      height: 100vh;
      z-index: 50;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 2rem;
    }

    .logo img {
      width: 32px;
      height: 32px;
    }

    .logo h1 {
      font-size: 1.25rem;
      font-weight: 600;
    }

    .nav-menu {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .nav-link {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.75rem 1rem;
      text-decoration: none;
      color: var(--text-secondary);
      border-radius: 0.5rem;
      transition: all 0.2s ease;
    }

    .nav-link:hover {
      background: var(--bg-color);
      color: var(--primary-color);
    }

    .nav-link.active {
      background: var(--primary-color);
      color: white;
    }

    .nav-link img {
      width: 20px;
      height: 20px;
      filter: brightness(0);
    }

    .nav-link.active img {
      filter: brightness(0) invert(1);
    }

    .main-content {
      flex: 1;
      margin-left: 280px;
      padding: 2rem;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
    }

    .header h2 {
      font-size: 1.5rem;
      font-weight: 600;
    }

    .status-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 1.5rem;
      margin-bottom: 2rem;
    }

    .status-card {
      background: var(--card-bg);
      border-radius: 1rem;
      padding: 1.5rem;
      box-shadow: var(--shadow);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .status-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-lg);
    }

    .status-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
    }

    .status-title {
      font-weight: 600;
      font-size: 1.1rem;
    }

    .status-badge {
      padding: 0.25rem 0.75rem;
      border-radius: 9999px;
      font-size: 0.875rem;
      font-weight: 500;
    }

    .status-badge.active {
      background: #dcfce7;
      color: var(--success-color);
    }

    .status-badge.warning {
      background: #fef3c7;
      color: var(--warning-color);
    }

    .status-badge.danger {
      background: #fee2e2;
      color: var(--danger-color);
    }

    .status-details {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 1rem;
    }

    .detail-item {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }

    .detail-label {
      font-size: 0.875rem;
      color: var(--text-secondary);
    }

    .detail-value {
      font-weight: 500;
    }

    .battery-indicator {
      height: 8px;
      background: var(--border-color);
      border-radius: 9999px;
      overflow: hidden;
      margin-top: 0.5rem;
    }

    .battery-level {
      height: 100%;
      border-radius: 9999px;
      transition: width 0.3s ease;
    }

    .battery-level.high {
      background: var(--success-color);
      width: 85%;
    }

    .battery-level.medium {
      background: var(--warning-color);
      width: 60%;
    }

    .battery-level.low {
      background: var(--danger-color);
      width: 25%;
    }

    @media (max-width: 1024px) {
      aside {
        width: 240px;
      }
      .main-content {
        margin-left: 240px;
      }
    }

    @media (max-width: 768px) {
      .layout {
        flex-direction: column;
      }
      aside {
        width: 100%;
        height: auto;
        position: relative;
        border-right: none;
        border-bottom: 1px solid var(--border-color);
      }
      .main-content {
        margin-left: 0;
      }
      .status-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="layout">
    <aside>
      <div class="logo">
        <img src="Logo Icon.png" alt="UPS Logo" />
        <h1>UPS System</h1>
      </div>
      <nav class="nav-menu">
        <a href="#" class="nav-link active">
          <img src="Homee.png" alt="Dashboard" />
          Dashboard
        </a>
        <a href="#" class="nav-link">
          <img src="Battery Icon.svg" alt="Devices" />
          Devices
        </a>
        <a href="#" class="nav-link">
          <img src="Events Icon.svg" alt="Events" />
          Events
        </a>
        <a href="#" class="nav-link">
          <img src="Profile Icon.svg" alt="Profile" />
          Profile
        </a>
      </nav>
    </aside>

    <main class="main-content">
      <div class="header">
        <h2>Dashboard Overview</h2>
      </div>

      <div class="status-grid">
        <div class="status-card">
          <div class="status-header">
            <span class="status-title">Main UPS</span>
            <span class="status-badge active">Active</span>
          </div>
          <div class="status-details">
            <div class="detail-item">
              <span class="detail-label">Battery Level</span>
              <span class="detail-value">85%</span>
              <div class="battery-indicator">
                <div class="battery-level high"></div>
              </div>
            </div>
            <div class="detail-item">
              <span class="detail-label">Runtime</span>
              <span class="detail-value">2h 30m</span>
            </div>
            <div class="detail-item">
              <span class="detail-label">Load</span>
              <span class="detail-value">45%</span>
            </div>
            <div class="detail-item">
              <span class="detail-label">Temperature</span>
              <span class="detail-value">32°C</span>
            </div>
          </div>
        </div>

        <div class="status-card">
          <div class="status-header">
            <span class="status-title">Backup UPS</span>
            <span class="status-badge warning">Warning</span>
          </div>
          <div class="status-details">
            <div class="detail-item">
              <span class="detail-label">Battery Level</span>
              <span class="detail-value">60%</span>
              <div class="battery-indicator">
                <div class="battery-level medium"></div>
              </div>
            </div>
            <div class="detail-item">
              <span class="detail-label">Runtime</span>
              <span class="detail-value">1h 15m</span>
            </div>
            <div class="detail-item">
              <span class="detail-label">Load</span>
              <span class="detail-value">65%</span>
            </div>
            <div class="detail-item">
              <span class="detail-label">Temperature</span>
              <span class="detail-value">38°C</span>
            </div>
          </div>
        </div>

        <div class="status-card">
          <div class="status-header">
            <span class="status-title">Server UPS</span>
            <span class="status-badge danger">Critical</span>
          </div>
          <div class="status-details">
            <div class="detail-item">
              <span class="detail-label">Battery Level</span>
              <span class="detail-value">25%</span>
              <div class="battery-indicator">
                <div class="battery-level low"></div>
              </div>
            </div>
            <div class="detail-item">
              <span class="detail-label">Runtime</span>
              <span class="detail-value">30m</span>
            </div>
            <div class="detail-item">
              <span class="detail-label">Load</span>
              <span class="detail-value">85%</span>
            </div>
            <div class="detail-item">
              <span class="detail-label">Temperature</span>
              <span class="detail-value">42°C</span>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>
</body>
</html>
